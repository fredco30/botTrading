# Minimal CI for the canonical research engine and its research components.
# Runs ONLY the synthetic unit/causality suites (test_*.py: research engine
# + EMA base signal).  No optimizer, no real backtest, no broker access,
# no secrets, no OOS data, no real Forex dataset.
name: research-engine-tests

on:
  pull_request:
  push:
    branches:
      - "research/**"

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies (numpy/pandas/pyarrow — no broker, no data)
        run: pip install numpy pandas pyarrow
      - name: Run root research suites (synthetic only)
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Run H1/H4 research suites (synthetic only)
        run: python -m unittest discover -s research/autonomous_h1_h4_2026_09 -p "test_*.py" -v
      - name: Run P000 phenomena-discovery suites (synthetic only)
        run: python -m unittest discover -s research/phenomena_discovery_v1 -p "test_*.py" -v
      - name: Run P013R V1 validation suites (synthetic only)
        run: python -m unittest discover -s research/p013r_v1_validation -p "test_*.py" -v
      - name: Run TICK-M1 microstructure suites (synthetic only)
        run: python -m unittest discover -s research/tick_m1_microstructure -p "test_*.py" -v
